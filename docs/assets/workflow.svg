<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc"><title id="title">Sunny DevFix debugging workflow</title><desc id="desc">Input moves through analysis, diagnosis, fix review, approval, safe application, separate verification and optional rollback.</desc><rect width="1200" height="300" rx="28" fill="#10191c"/><text x="48" y="55" fill="#edf4f2" font-family="system-ui,sans-serif" font-size="24" font-weight="700">Reviewable debugging lifecycle</text><g font-family="system-ui,sans-serif" font-size="14" text-anchor="middle"><g fill="#172729" stroke="#36554d"><rect x="30" y="110" width="120" height="70" rx="13"/><rect x="175" y="110" width="120" height="70" rx="13"/><rect x="320" y="110" width="120" height="70" rx="13"/><rect x="465" y="110" width="120" height="70" rx="13"/><rect x="610" y="110" width="120" height="70" rx="13"/><rect x="755" y="110" width="120" height="70" rx="13"/><rect x="900" y="110" width="120" height="70" rx="13"/><rect x="1045" y="110" width="125" height="70" rx="13"/></g><g fill="#edf4f2"><text x="90" y="152">Input</text><text x="235" y="152">Analyze</text><text x="380" y="152">Diagnose</text><text x="525" y="152">Review fix</text><text x="670" y="152">Approve</text><text x="815" y="152">Apply</text><text x="960" y="152">Verify</text><text x="1107" y="152">Rollback</text></g><g fill="#94e6bd" font-size="22"><text x="162" y="154">→</text><text x="307" y="154">→</text><text x="452" y="154">→</text><text x="597" y="154">→</text><text x="742" y="154">→</text><text x="887" y="154">→</text><text x="1032" y="154">→</text></g><text x="600" y="240" fill="#91a3a0">Preview never writes · approval is explicit · applied is not verified</text></g></svg>
