<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" role="img" aria-labelledby="title desc"><title id="title">Sunny DevFix patch security boundary</title><desc id="desc">Authorized roots, exact approval tokens, stale-file validation, atomic replacement and guarded rollback protect local files.</desc><rect width="1100" height="440" rx="28" fill="#10191c"/><text x="48" y="55" fill="#edf4f2" font-family="system-ui,sans-serif" font-size="25" font-weight="700">Patch safety checks</text><g font-family="system-ui,sans-serif"><g fill="#172729" stroke="#94e6bd"><rect x="50" y="100" width="270" height="275" rx="18"/><rect x="780" y="100" width="270" height="275" rx="18"/></g><rect x="415" y="100" width="270" height="275" rx="18" fill="#22303f" stroke="#92c4ff"/><g font-size="17" font-weight="700"><text x="78" y="140" fill="#94e6bd">1 · Authorized boundary</text><text x="443" y="140" fill="#92c4ff">2 · Exact approval</text><text x="808" y="140" fill="#94e6bd">3 · Recoverable write</text></g><g fill="#edf4f2" font-size="14"><text x="78" y="190">Explicit roots · relative paths</text><text x="78" y="230">Traversal and symlinks rejected</text><text x="443" y="190">Before/after content digests</text><text x="443" y="230">One-time · five-minute token</text><text x="443" y="270">Stale previews rejected</text><text x="808" y="190">Atomic replacement</text><text x="808" y="230">Permissions preserved</text><text x="808" y="270">Guarded one-time rollback</text></g><text x="550" y="414" text-anchor="middle" fill="#91a3a0" font-size="14">Disabled by default · existing UTF-8 files only · no code execution</text></g></svg>
