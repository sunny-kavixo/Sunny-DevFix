<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="400" viewBox="0 0 1060 400" role="img" aria-labelledby="title desc"><title id="title">Sunny DevFix architecture</title><desc id="desc">Browser and editor extensions communicate with the local FastAPI service, which uses static analysis and an optional isolated Docker evidence runner.</desc><rect width="1060" height="400" rx="25" fill="#10191c"/><g font-family="ui-monospace,monospace" text-anchor="middle"><rect x="45" y="76" width="250" height="100" rx="15" fill="#1b3232" stroke="#94e6bd"/><text x="170" y="119" fill="#d9f5e7" font-size="20">Browser workspace</text><text x="170" y="148" fill="#9dbab0" font-size="14">HTML / CSS / JS</text><rect x="45" y="221" width="250" height="100" rx="15" fill="#1b3232" stroke="#94e6bd"/><text x="170" y="261" fill="#d9f5e7" font-size="18">Editor prototypes</text><text x="170" y="287" fill="#9dbab0" font-size="14">VS Code / Chrome</text><rect x="401" y="134" width="258" height="130" rx="16" fill="#22303f" stroke="#92c4ff"/><text x="530" y="178" fill="#e1efff" font-size="21">Local FastAPI</text><text x="530" y="211" fill="#abc4d6" font-size="15">/api/analyze</text><text x="530" y="236" fill="#abc4d6" font-size="15">/api/guardian</text><rect x="767" y="52" width="255" height="112" rx="16" fill="#1b3232" stroke="#94e6bd"/><text x="894" y="94" fill="#e5f9ed" font-size="18">Static analysis</text><text x="894" y="125" fill="#9dbab0" font-size="14">No source execution</text><rect x="767" y="237" width="255" height="112" rx="16" fill="#342e23" stroke="#f2c477"/><text x="894" y="279" fill="#fff0d8" font-size="18">Docker evidence</text><text x="894" y="308" fill="#e2c897" font-size="14">Opt-in and isolated</text></g><path d="M295 126H365V189H401M295 271H365V209H401M659 181H711V108H767M659 222H711V293H767" fill="none" stroke="#6ea995" stroke-width="3"/><text x="530" y="40" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#8ea8a0">Local-first architecture · no external AI API required</text></svg>