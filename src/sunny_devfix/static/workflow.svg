<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc"><title id="title">Sunny DevFix debugging workflow</title><desc id="desc">A Python traceback is analyzed into a precise explanation, a reviewed patch and optional sandbox evidence.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#152325"/><stop offset="1" stop-color="#10161d"/></linearGradient><linearGradient id="accent" x2="1"><stop stop-color="#94e6bd"/><stop offset="1" stop-color="#92c4ff"/></linearGradient></defs><rect width="1120" height="470" rx="30" fill="url(#bg)"/><rect x="25" y="25" width="1070" height="420" rx="22" fill="#10191c" stroke="#36554d"/><circle cx="59" cy="60" r="7" fill="#f28782"/><circle cx="82" cy="60" r="7" fill="#f2c477"/><circle cx="105" cy="60" r="7" fill="#94e6bd"/><text x="140" y="67" font-size="18" fill="#c8ddd6" font-family="ui-monospace,monospace">sunny-devfix / local workspace</text><rect x="48" y="97" width="312" height="285" rx="14" fill="#172729" stroke="#45665d"/><text x="68" y="133" fill="#94e6bd" font-size="16" font-family="ui-monospace,monospace">01 / PYTHON TRACEBACK</text><text x="68" y="180" fill="#f28782" font-size="15" font-family="ui-monospace,monospace">NameError: username</text><text x="68" y="214" fill="#b2c8c0" font-size="14" font-family="ui-monospace,monospace">line 2: return ...</text><text x="68" y="245" fill="#849e96" font-size="14" font-family="ui-monospace,monospace">inspect failing frame</text><path d="M383 238H415" stroke="url(#accent)" stroke-width="4"/><path d="m409 229 10 9-10 9" fill="none" stroke="#94e6bd" stroke-width="4"/><rect x="439" y="97" width="290" height="285" rx="14" fill="#172729" stroke="#45665d"/><text x="459" y="133" fill="#94e6bd" font-size="16" font-family="ui-monospace,monospace">02 / REVIEW FIX</text><text x="459" y="181" fill="#f28782" font-size="15" font-family="ui-monospace,monospace">- username</text><text x="459" y="215" fill="#94e6bd" font-size="15" font-family="ui-monospace,monospace">+ user_name</text><text x="459" y="258" fill="#b2c8c0" font-size="14" font-family="ui-monospace,monospace">Syntax validated</text><text x="459" y="287" fill="#849e96" font-size="14" font-family="ui-monospace,monospace">Explicit user approval</text><path d="M750 238H780" stroke="url(#accent)" stroke-width="4"/><path d="m774 229 10 9-10 9" fill="none" stroke="#92c4ff" stroke-width="4"/><rect x="802" y="97" width="266" height="285" rx="14" fill="#172729" stroke="#45665d"/><text x="822" y="133" fill="#92c4ff" font-size="16" font-family="ui-monospace,monospace">03 / EVIDENCE</text><text x="822" y="183" fill="#c8ddd6" font-size="15" font-family="ui-monospace,monospace">Opt-in Docker run</text><text x="822" y="219" fill="#94e6bd" font-size="14" font-family="ui-monospace,monospace">network: disabled</text><text x="822" y="250" fill="#94e6bd" font-size="14" font-family="ui-monospace,monospace">filesystem: read-only</text><text x="822" y="286" fill="#849e96" font-size="13" font-family="ui-monospace,monospace">No Docker? Not run.</text><text x="49" y="416" fill="#9fb7ae" font-size="15" font-family="system-ui,sans-serif">Static analysis never executes submitted code. Sandbox verification is optional and isolated.</text></svg>